# P1-03 — NationLabs Orchestrator MVP stack
# Postgres: native systemd service on the VM (owns PITR cron + audit schema).
# Ollama:   existing container (untouched).
# This stack: FastAPI API + LangGraph worker. Reboot-persistent via
# restart: unless-stopped + docker.service (enabled by default on Ubuntu).
name: nl-orchestrator

services:
  api:
    build: .
    container_name: nl-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach native Postgres + Ollama
    environment:
      PG_DSN: postgresql://orchestrator_app:${PG_APP_PASSWORD}@host.docker.internal:5432/orchestrator
      OLLAMA_URL: http://host.docker.internal:11434
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/healthz', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    container_name: nl-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PG_DSN: postgresql://orchestrator_app:${PG_APP_PASSWORD}@host.docker.internal:5432/orchestrator
