# P1-07 — Orchestrator API with real workflow graph (runs in API process).
# Postgres native, Ollama existing container — both reached via host gateway.
name: nl-orchestrator

services:
  api:
    build: .
    container_name: nl-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PG_DSN: postgresql://orchestrator_app:${PG_APP_PASSWORD}@host.docker.internal:5432/orchestrator
      OLLAMA_URL: http://host.docker.internal:11434
      ANALYSIS_MODEL: qwen3:14b
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/healthz', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
