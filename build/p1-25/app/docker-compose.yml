# P1-07 — Orchestrator API with real workflow graph (runs in API process).
# Postgres native, Ollama existing container — both reached via host gateway.
name: nl-orchestrator

services:
  api:
    build: .
    container_name: nl-api
    restart: unless-stopped
    ports:
      - "${ORCHESTRATOR_HTTP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rfp-archive:/srv/data/rfp_archive   # originals preserved byte-for-byte
      - quote-archive:/srv/data/quote_archive # raw vendor quotes, content-addressed
    environment:
      PG_DSN: postgresql://orchestrator_app:${PG_APP_PASSWORD}@${PG_HOST:-host.docker.internal}:${PG_PORT:-5432}/${PG_DATABASE:-orchestrator}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ANALYSIS_MODEL: qwen3:14b
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      RAG_DRAFT_MODEL: ${RAG_DRAFT_MODEL:-qwen3:14b}
      RAG_OLLAMA_TIMEOUT_S: ${RAG_OLLAMA_TIMEOUT_S:-300}
      PROPOSAL_BUILDER_URL: ${PROPOSAL_BUILDER_URL:-http://host.docker.internal:3000}
      PROPOSAL_BUILDER_BUILD_URL: ${PROPOSAL_BUILDER_BUILD_URL:-}
      PROPOSAL_BUILDER_USERNAME: ${PROPOSAL_BUILDER_USERNAME:-}
      PROPOSAL_BUILDER_PASSWORD: ${PROPOSAL_BUILDER_PASSWORD:-}
      PROPOSAL_BUILDER_TIMEOUT_S: ${PROPOSAL_BUILDER_TIMEOUT_S:-120}
      QUOTE_VALIDATION_MONEY_TOLERANCE: ${QUOTE_VALIDATION_MONEY_TOLERANCE:-0.01}
      QUOTE_VALIDATION_REQUIRE_CURRENCY_DETECTED: ${QUOTE_VALIDATION_REQUIRE_CURRENCY_DETECTED:-true}
      QUOTE_VALIDATION_REQUIRE_STATED_TOTALS: ${QUOTE_VALIDATION_REQUIRE_STATED_TOTALS:-false}
      QUOTE_VALIDATION_REQUIRE_VAT: ${QUOTE_VALIDATION_REQUIRE_VAT:-false}
      QUOTE_VALIDATION_REQUIRED_TERMS: ${QUOTE_VALIDATION_REQUIRED_TERMS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/healthz', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  rag-worker:
    build: .
    restart: unless-stopped
    command: ["python", "rag_worker.py"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PG_DSN: postgresql://orchestrator_app:${PG_APP_PASSWORD}@${PG_HOST:-host.docker.internal}:${PG_PORT:-5432}/${PG_DATABASE:-orchestrator}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      RAG_DRAFT_MODEL: ${RAG_DRAFT_MODEL:-qwen3:14b}
      RAG_OLLAMA_TIMEOUT_S: ${RAG_OLLAMA_TIMEOUT_S:-300}
      RAG_WORKER_POLL_S: ${RAG_WORKER_POLL_S:-2}

volumes:
  rfp-archive:
  quote-archive:
