# Prod environment - AI Guardrail Policy v1.0, Section 8.
# reasoning_config strips the model's <think>...</think> reasoning trace before
# the response reaches the client - the only functional difference from
# config_uat. DeepSeek and Nemotron-family models both use <think>/</think> as
# their reasoning delimiters, which is what qwen3/deepseek-r1 produce.
#
# CORRECTION (26-Jul-2026): this `reasoning_config` block does not actually
# do anything in nemoguardrails 0.23.0 (confirmed from the installed
# library's own source - these fields are read nowhere at runtime). Prod
# hiding reasoning traces was, until 26-Jul-2026, accidental rather than
# caused by this setting - the library's server response code never
# surfaced reasoning traces for EITHER environment. That is now fixed for
# UAT only via a targeted actions.py monkeypatch (see config_uat/default/
# actions.py and RUNBOOK.md Section 6.9). Prod deliberately does NOT get
# that patch, so Prod's actual current behavior (hide reasoning) still
# matches this file's stated intent - just via inaction/the original
# library gap rather than via this config block. Left as-is as the
# policy-level statement that Prod should hide reasoning; no code change
# needed here for that to remain true.
#
# Same shared Ollama backend as UAT (single A30 - see policy Section 8.1).
#
# rails.input/output.flows reference "... with audit" flows (audit_flows.co)
# instead of the library's built-in "self check input"/"self check output" -
# Layer 2 structured audit logging (AI Guardrail Policy v1.1 Section 10.1),
# promoted from UAT 22-Jul-2026 after full verification there: input
# block/allow AND output block/allow all confirmed correct via live tests
# and Loki queries (RUNBOOK.md Section 6.6) - not promoted on assumption.
# actions.py, audit_flows.co, flag_flows.co, and prompts.yml are all
# byte-identical to config_uat/default's - only the environment differs,
# read at runtime from OTEL_RESOURCE_ATTRIBUTES (docker-compose.yml), not
# from anything in this config directory.
#
# Each flows list below runs a SECOND flow after the block/allow gate: "flag
# check ... with audit" (flag_flows.co), implementing the policy's
# non-blocking "Flag + Log" tier for profanity/mild toxicity (Section 2,
# Section 9's "Medium" enforcement row -- added 26-Jul-2026, promoted here
# same day after verification in UAT). If the first flow blocks, it calls
# Colang's `stop`, so the flag-check flow never runs for blocked traffic. If
# allowed, the flag-check flow runs next and can only add a "flagged" audit
# log entry -- it never blocks or stops the pipeline itself. Confirmed this
# `stop` behavior empirically (a minimal standalone RailsConfig test, not
# inferred from source reading alone) before relying on it here.

models:
  - type: main
    engine: ollama
    model: qwen3:14b
    parameters:
      base_url: http://ollama:11434/v1
    reasoning_config:
      remove_reasoning_traces: True
      start_token: "<think>"
      end_token: "</think>"

  - type: self_check_input
    engine: ollama
    model: gemma3:4b
    parameters:
      base_url: http://ollama:11434/v1

  - type: self_check_output
    engine: ollama
    model: gemma3:4b
    parameters:
      base_url: http://ollama:11434/v1

  - type: content_flag_check
    engine: ollama
    model: gemma3:4b
    parameters:
      base_url: http://ollama:11434/v1

rails:
  input:
    flows:
      - self check input with audit
      - flag check input with audit
  output:
    flows:
      - self check output with audit
      - flag check output with audit
